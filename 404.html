<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting to kharchlog.com…</title>
  <link rel="canonical" href="https://kharchlog.com/" />
  <!-- No meta-refresh race: JS only (noscript fallback below) -->
  <script>
    (function () {
      // Strip project-pages prefix so github.io/kharchlog-forwarding/...
      // never becomes kharchlog.com/kharchlog-forwarding/...
      var path = String(location.pathname || '/');
      path = path.replace(/\/kharchlog-forwarding\/?/gi, '/');
      path = path.replace(/\/{2,}/g, '/');
      if (!path || path === '') path = '/';
      if (path.charAt(0) !== '/') path = '/' + path;
      var dest = 'https://kharchlog.com' + path + location.search + location.hash;
      location.replace(dest);
    })();
  </script>
</head>
<body>
  <p>Moved permanently to <a href="https://kharchlog.com/">https://kharchlog.com/</a></p>
  <noscript>
    <meta http-equiv="refresh" content="0;url=https://kharchlog.com/" />
  </noscript>
</body>
</html>
